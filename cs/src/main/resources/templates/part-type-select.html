<!DOCTYPE html>
<html>
<head>
    <title>Add Part - KrisTechna</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <h1>Add New Part</h1>
    <div class="nav">
        <a href="/">Home</a> |
        <a href="/parts">Parts</a> |
        <a href="/products">Products</a>
    </div>

    <h2>Choose Part Type</h2>
    <div class="part-types">
        <div class="part-type">
            <h3>In-House Part</h3>
            <p>Manufactured in our facility</p>
            <a href="/parts/add/inhouse" class="btn">Add In-House Part</a>
        </div>
        <div class="part-type">
            <h3>Outsourced Part</h3>
            <p>From external suppliers</p>
            <a href="/parts/add/outsourced" class="btn">Add Outsourced Part</a>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <a href="/parts" class="btn">Back to Parts</a>
    </div>
</div>
</body>
</html>
