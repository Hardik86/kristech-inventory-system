<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${part.id != null} ? 'Edit Part' : 'Add Inhouse Part'">Add Part</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <h1 th:text="${part.id != null} ? 'Edit Inhouse Part' : 'Add Inhouse Part'">Add Inhouse Part</h1>
    <div class="nav">
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/parts}">Parts</a> |
        <a th:href="@{/products}">Products</a>
    </div>

    <div th:if="${error}"
         style="color: red; margin: 10px 0; padding: 10px; background-color: #ffe6e6; border: 1px solid #ffcccc; border-radius: 4px;"
         th:text="${error}"></div>

    <form th:action="${part.id != null} ?
                          @{/parts/update/{id}(id=${part.id})} :
                          @{/parts/add/inhouse}"
          method="post">

        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" th:value="${part.name}" required>
        </div>

        <div class="form-group">
            <label>Price ($):</label>
            <input type="number" name="price" th:value="${part.price}" step="0.01" min="0.01" required>
        </div>

        <!-- NEW MULTIPACK FIELDS -->
        <div class="form-group">
            <label>
                <input type="checkbox" name="multipack" th:checked="${part.multipack}">
                This is a multipack
            </label>
        </div>

        <div class="form-group">
            <label>Items in Pack:</label>
            <input type="number" name="packSize" th:value="${part.packSize}" min="1" required>
            <small th:if="${part.multipack}">
                🏷️ Pack of <span th:text="${part.packSize}"></span> |
                Unit price: $<span th:text="${#numbers.formatDecimal(part.unitPrice, 1, 2)}"></span>
            </small>
        </div>

        <div class="form-group">
            <label>Inventory (Packs):</label>
            <input type="number" name="inv" th:value="${part.inv}" required>
        </div>

        <div class="form-group">
            <label>Min Inventory (Packs):</label>
            <input type="number" name="minInventory" th:value="${part.minInventory}" required>
        </div>

        <div class="form-group">
            <label>Max Inventory (Packs):</label>
            <input type="number" name="maxInventory" th:value="${part.maxInventory}" required>
        </div>

        <div class="form-group">
            <label>Machine ID:</label>
            <input type="number" name="machineId" th:value="${part.machineId}" required>
        </div>

        <button type="submit" class="btn">
            <span th:text="${part.id != null} ? 'Update' : 'Add'"></span> Part
        </button>
        <a th:href="@{/parts}" class="btn">Cancel</a>
    </form>
</div>
</body>
</html>
