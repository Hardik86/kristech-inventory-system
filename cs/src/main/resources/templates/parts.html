<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Parts - KrisTechna</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <h1>Parts Management</h1>
    <div class="nav">
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/parts}">Parts</a> |
        <a th:href="@{/products}">Products</a> |
        <a th:href="@{/about}">About</a>
    </div>

    <!-- MESSAGE DISPLAY -->
    <div th:if="${param.message}" class="success" th:text="${param.message}"></div>
    <div th:if="${param.error}" class="error" th:text="${param.error}"></div>

    <!-- SEARCH BAR (UNCHANGED - STILL WORKS) -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search parts..." onkeyup="filterParts()">
        <button onclick="clearSearch()" class="btn">Clear</button>
    </div>

    <div class="actions">
        <a href="/parts/chooseType" class="btn">Add New Part</a>
    </div>

    <table id="partsTable">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Min</th>
            <th>Max</th>
            <th>Actions</th>
        </tr>
        <tr th:each="part : ${parts}">
            <td>
                <span th:text="${part.name}"></span>
                <small th:if="${part.multipack}"
                       th:text="' (Pack of ' + ${part.packSize} + ')'"
                       style="color: #2196F3; font-style: italic;"></small>
            </td>
            <td>
                $<span th:text="${#numbers.formatDecimal(part.price, 1, 2)}"></span>
                <small th:if="${part.multipack}" style="display: block; color: #666; font-size: 0.8em;">
                    $<span th:text="${#numbers.formatDecimal(part.unitPrice, 1, 2)}"></span>/unit
                </small>
            </td>
            <td th:text="${part.inv}"></td>
            <td th:text="${part.minInventory}"></td>
            <td th:text="${part.maxInventory}"></td>
            <td>
                <!-- UPDATE/DELETE BUTTONS (UNCHANGED - STILL WORK) -->
                <a th:href="@{/parts/edit/{id}(id=${part.id})}" class="btn">Update</a>
                <a th:href="@{/parts/delete/{id}(id=${part.id})}" class="btn delete"
                   onclick="return confirm('Delete this part?')">Delete</a>
            </td>
        </tr>
    </table>
</div>

<!-- SEARCH JAVASCRIPT (UNCHANGED - STILL WORKS) -->
<script>
    function filterParts() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase();
        const table = document.getElementById('partsTable');
        const tr = table.getElementsByTagName('tr');

        for (let i = 1; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName('td')[0];
            if (td) {
                const txtValue = td.textContent || td.innerText;
                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                    tr[i].style.display = '';
                } else {
                    tr[i].style.display = 'none';
                }
            }
        }
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        filterParts();
    }
</script>
</body>
</html>
