<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase Confirmation - KrisTechna</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <h1>🎉 Purchase Successful!</h1>
    <div class="nav">
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/products}">Continue Shopping</a>
    </div>

    <div style="background: #e8f5e8; padding: 25px; border-radius: 8px; margin: 20px 0; border: 2px solid #4CAF50;">
        <h2 style="color: #2E7D32;">Thank You for Your Purchase!</h2>
        <p>Your order has been processed successfully.</p>
    </div>

    <!-- Order Details -->
    <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin: 20px 0;">
        <h3>Order Details</h3>

        <!-- Product -->
        <div style="padding: 15px; background: #f9f9f9; border-radius: 5px; margin: 10px 0;">
            <h4 th:text="${product.name}">Product Name</h4>
            <p><strong>Price:</strong> $<span th:text="${#numbers.formatDecimal(productPrice, 1, 2)}"></span></p>
        </div>

        <!-- Selected Parts -->
        <div th:if="${selectedParts != null and !selectedParts.empty}">
            <h4>Additional Parts:</h4>
            <div th:each="part : ${selectedParts}"
                 style="padding: 10px; background: #f0f8ff; border-radius: 5px; margin: 5px 0;">
                <strong th:text="${part.name}"></strong> -
                $<span th:text="${#numbers.formatDecimal(part.price, 1, 2)}"></span>
                <span th:if="${part.multipack}" style="color: #2196F3;">
                    (Pack of <span th:text="${part.packSize}"></span>)
                </span>
            </div>
        </div>

        <!-- Cost Breakdown -->
        <div style="background: #fff3e0; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <h4>Cost Summary</h4>
            <p><strong>Product:</strong> $<span th:text="${#numbers.formatDecimal(productPrice, 1, 2)}"></span></p>
            <p th:if="${selectedParts != null and !selectedParts.empty}">
                <strong>Parts:</strong> $<span th:text="${#numbers.formatDecimal(partsTotal, 1, 2)}"></span>
            </p>
            <p style="font-size: 1.3em; font-weight: bold; border-top: 2px solid #ff9800; padding-top: 10px;">
                <strong>Total Paid: $</strong><span th:text="${#numbers.formatDecimal(totalCost, 1, 2)}"></span>
            </p>
        </div>
    </div>

    <div style="text-align: center; margin: 30px 0;">
        <a th:href="@{/products}" class="btn" style="background: #2196F3;">Continue Shopping</a>
        <a th:href="@{/}" class="btn">Return Home</a>
    </div>
</div>
</body>
</html>
